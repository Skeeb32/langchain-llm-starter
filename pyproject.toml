[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-llm-starter"
version = "0.1.0"
description = "A small, testable LangChain chat application with local Ollama models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langchain>=1,<2", "langchain-ollama>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
langchain-llm = "langchain_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
